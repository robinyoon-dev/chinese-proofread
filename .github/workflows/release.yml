name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Pushes that land close together must not race to create the same release.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the release for a new plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version plugins/chinese-proofread/.claude-plugin/plugin.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin.json version is not X.Y.Z: $version"
            exit 1
          fi

          tag="v$version"
          # Check the remote: a shallow checkout does not fetch tags.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi

          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
